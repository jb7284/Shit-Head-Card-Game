cache_path: .swiftlint_cache

excluded:
  - .build
  - DerivedData
  - "**/DerivedSources"

disabled_rules:
  - trailing_whitespace

identifier_name:
  min_length:
    warning: 2
    error: 1
  excluded:
    - i
    - j
    - k
    - n
    - x
    - y
    - ai
    - d1
    - d2
    - p

type_name:
  excluded:
    - _H_T_HeadApp
    - _H_T_HeadTests
    - _H_T_HeadUITests
    - _H_T_HeadUITestsLaunchTests

line_length:
  warning: 140
  error: 180
  ignores_comments: true

file_length:
  warning: 750
  error: 900

type_body_length:
  warning: 650
  error: 800
